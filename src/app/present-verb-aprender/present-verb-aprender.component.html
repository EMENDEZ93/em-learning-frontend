<mat-drawer-container class="em-form">
    <div>
        <button (click)="getRutina()" *ngIf="hoyYaRealizoAprender" type="button" class="btn btn-primary"> Iniciar Aprendizaje </button>
    </div>
    <div class="container container-form-em" *ngIf="hoyYaRealizoAprender == false">
        <div class="container">
            <div class="row">
                <div class="col-sm">
                    <div class="progress bar-container">
                        <div class="progress-bar progress-bar-striped active" [ngStyle]="{width: barraProgreso + '%'}"
                            role="progressbar" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100"
                            style="width:40%">
                            {{barraProgreso}}%
                        </div>
                    </div>
                    <table class="table-medium-font">
                        <thead>
                            <tr id="th_main">
                                <th>{{englishVerbo}}</th>
                                <th rowspan="2">{{spanishVerbo}}</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>{{foneticaVerbo}}</td>
                            </tr>
                        </tbody>
                    </table>                    
                    <table class="table-medium-font" *ngIf="examples && examples.length > 0">
                        <thead>
                            <tr>
                                <th>N°</th>
                                <th>Example</th>
                                <th>Translate</th>
                                <th>Reproducir</th>
                            </tr>
                        </thead>
                        <tbody>
                            <ng-container *ngFor="let example of examples.slice().reverse(); let i = index;" id="fila_{i}">
                                <tr id="fila_{{examples.length - 1 - i}}">
                                    <th rowspan="2"> {{i}}</th>
                                    <th>{{example.english}}</th>
                                    <td rowspan="2">{{example.spanish}}</td>
                                    <td rowspan="2">
                                        <button (click)="reproducir_individual(examples.length - 1 - i)">Action</button>
                                    </td>
                                </tr>
                                <tr id="fila_{{examples.length - 1 - i}}_">
                                    <td>{{example.fonetica}}</td>
                                </tr>
                            </ng-container>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <div class="fixed-footer">
        <button (click)="autocompletar()" type="button" class="btn btn-primary">* Autocompletar*</button>
    </div>
    <p *ngIf="hoyYaRealizoAprender == true">Hoy ya realizaste esta Rutina -> {{hoyYaRealizoAprender}}</p>
</mat-drawer-container>
