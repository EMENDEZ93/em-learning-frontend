
    <div class="table-container-sin-imagen">
   
        <table *ngIf="hoyYaRealizoAprender == false">
            <tbody>
                <tr id="th_main" style="background-color: #022802; text-align: left; color: rgb(138 138 138);">
                    <td>
                        <img *ngIf="images !== 'NO_APLICA' && images !== undefined && images !== null" 
                        [src]="'data:image/png;base64,' + images" 
                        alt="Imagen" 
                        class="responsive-image">
                        <br>
                        {{englishVerbo | replaceNewline}}
                    </td>
                    <td [innerHTML]="spanishVerbo | replaceNewline"></td>
                    <td [innerHTML]="foneticaVerbo | replaceNewline"></td>
                </tr>
                <ng-container *ngIf="examples && examples.length > 0" style="color: rgb(138 138 138);">
                    <ng-container *ngFor="let example of examples; let i = index;" id="fila_{i}">
                        <tr id="fila_{{i}}" style="text-align: left; color: rgb(138 138 138);">
                            <td>
                                <div *ngIf="example.imagen !== 'NO_APLICA' && example.imagen !== undefined && example.imagen !== null">
                                    <img [src]="'data:image/png;base64,' + example.imagen" 
                                    alt="Imagen" 
                                    class="responsive-image">
                                    <br>
                                </div>
                                {{example.english | replaceNewline}}
                                <!-- <br><span style="font-size: xx-small;">{{example.spanish | replaceNewline}}</span>-->
                            </td>      
                            <td [innerHTML]="example.spanish | replaceNewline"></td>
                            <td [innerHTML]="example.fonetica | replaceNewline"></td>
                        </tr>
                    </ng-container>
                </ng-container>
            </tbody>
        </table>
        <p *ngIf="hoyYaRealizoAprender == true">Hoy ya realizaste esta Rutina -> {{hoyYaRealizoAprender}}</p>
    </div>   

<div class="fixed-footer">
    <button class="autocompletar" (click)="autocompletar()">Next</button>
</div>
